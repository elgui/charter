name: charter
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main, staging]
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Fetch pull-request heads, so evidence commits survive squash and rebase merges
        run: git fetch --no-tags --quiet origin '+refs/pull/*/head:refs/remotes/origin/pr/*' || true
      - name: Gates on the change set
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 .charter/bin/charter check --all --ci ${BASE:+--base "$BASE"}
      - name: Anchors on progress syntheses and reports
        run: |
          set -e
          files=$(git ls-files 'charter/progress.md' 'docs/progress*.md' 'docs/report*.md' 2>/dev/null || true)
          [ -z "$files" ] || python3 .charter/bin/charter anchors $files
      - name: Anchors on the pull request description (warning)
        if: github.event_name == 'pull_request'
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "$BODY" > "$RUNNER_TEMP/pr-body.md"
          python3 .charter/bin/charter anchors --pr "$RUNNER_TEMP/pr-body.md"
