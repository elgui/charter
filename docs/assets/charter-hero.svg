<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Charter: from agreement to evidence</title>
  <desc id="desc">A glowing path connects an agreed scope, a work unit, and verified evidence.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#10172b"/>
      <stop offset="1" stop-color="#172842"/>
    </linearGradient>
    <linearGradient id="path" x2="1">
      <stop stop-color="#5fe1c2"/>
      <stop offset="0.52" stop-color="#89aefc"/>
      <stop offset="1" stop-color="#ffc18c"/>
    </linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="14"/></filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".055"/>
    </pattern>
  </defs>
  <rect width="1200" height="380" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="26" fill="url(#grid)"/>
  <circle cx="975" cy="80" r="180" fill="#75b8f2" opacity=".08" filter="url(#glow)"/>
  <circle cx="172" cy="340" r="160" fill="#52dfbd" opacity=".07" filter="url(#glow)"/>
  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <g transform="translate(65 58)">
      <rect width="138" height="34" rx="17" fill="#5fe1c2" fill-opacity=".12" stroke="#5fe1c2" stroke-opacity=".45"/>
      <circle cx="18" cy="17" r="5" fill="#5fe1c2"/>
      <text x="32" y="23" fill="#bbf7e9" font-size="13" font-weight="700" letter-spacing="1.5">THE METHOD</text>
    </g>
    <text x="64" y="159" fill="#f4f7ff" font-size="72" font-weight="750" letter-spacing="-3">Charter</text>
    <text x="66" y="202" fill="#b8c8df" font-size="22">Give agent work a clear agreement,</text>
    <text x="66" y="233" fill="#b8c8df" font-size="22">a path through the work, and proof.</text>
    <path d="M67 300H1125" stroke="url(#path)" stroke-width="3" stroke-linecap="round"/>
    <g fill="#10172b" stroke-width="3">
      <circle cx="93" cy="300" r="11" stroke="#5fe1c2"/>
      <circle cx="591" cy="300" r="11" stroke="#89aefc"/>
      <circle cx="1087" cy="300" r="11" stroke="#ffc18c"/>
    </g>
    <g font-size="14" font-weight="700" letter-spacing="1.3">
      <text x="67" y="340" fill="#a8eddf">AGREEMENT</text>
      <text x="550" y="340" fill="#c5d5ff">WORK UNIT</text>
      <text x="1037" y="340" fill="#ffd9b5">EVIDENCE</text>
    </g>
    <g transform="translate(803 72)">
      <rect width="320" height="142" rx="16" fill="#24354e" stroke="#536b87" stroke-opacity=".8"/>
      <rect x="20" y="20" width="92" height="22" rx="11" fill="#5fe1c2" fill-opacity=".14"/>
      <text x="33" y="36" fill="#9df0dc" font-size="11" font-weight="700" letter-spacing="1">CHECKED</text>
      <path d="M22 70l8 8 15-17" fill="none" stroke="#5fe1c2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="60" y="78" fill="#e9f2ff" font-size="15" font-weight="650">Scope is named</text>
      <path d="M22 105l8 8 15-17" fill="none" stroke="#5fe1c2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="60" y="113" fill="#e9f2ff" font-size="15" font-weight="650">Done has evidence</text>
    </g>
  </g>
</svg>
