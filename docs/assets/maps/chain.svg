.cm .yes{fill:var(--owner-bg);stroke:var(--owner);stroke-width:1.2}
.cm .yes-agent{fill:var(--panel2);stroke:var(--line);stroke-width:1.2}
.cm .grid{stroke:var(--faint);stroke-width:1}
.cm .n,.cm .tile,.cm .gr,.cm .ar{cursor:pointer}
</style><rect class="page" x="0" y="0" width="1400" height="630" fill="var(--paper)"/><defs><marker id="chain-rule" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk mk-rule"/></marker><marker id="chain-cite" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk mk-cite"/></marker><marker id="chain-propose" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk mk-propose"/></marker><marker id="chain-gate" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk mk-gate"/></marker><marker id="chain-machine" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk mk-machine"/></marker><marker id="chain-flow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk mk-flow"/></marker><marker id="chain-wait" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk mk-wait"/></marker></defs><text x="24.0" y="40.0" class="serif" font-size="22" >A chain of sessions over the road</text><text x="24.0" y="64.0" class="sub" font-size="13" >/charter-chain starts it; every session checks the one before; Codex reviews each group; the owner answers a wait with one command and two words.</text><rect x="150" y="96" width="560" height="196" rx="12" class="bg-art cl cl-art" stroke-dasharray="5 4"/><text x="166.0" y="116.0" class="cap t-art" font-size="11" >GROUP 1 = RAIL ITEM r1</text><rect x="850" y="96" width="530" height="196" rx="12" class="bg-art cl cl-art" stroke-dasharray="5 4"/><text x="866.0" y="116.0" class="cap t-art" font-size="11" >GROUP 2 = RAIL ITEM r2</text><rect x="20" y="150" width="112" height="84" rx="10" class="cl cl-owner bg-owner"/><text x="76.0" y="178.0" class="mono b t-owner" font-size="12" text-anchor="middle" >/charter-chain</text><text x="76.0" y="196.0" class="sub" font-size="11.5" text-anchor="middle" >unit + instruction</text><text x="76.0" y="212.0" class="mono sub" font-size="10.5" text-anchor="middle" >on chain/&lt;id&gt;</text><rect x="180" y="132" width="170" height="122" rx="10" class="card"/><text x="194.0" y="154.0" class="b" font-size="15" >s01</text><text x="194.0" y="172.0" class="sub" font-size="11.5" >first session</text><rect x="194" y="186" width="142" height="14" rx="3" class="gauge"/><rect x="194" y="186" width="81.6" height="14" rx="3" class="gauge-fill"/><path d="M282.8,182 V204" class="s-chain" stroke-width="2"/><text x="279.8" y="216.0" class="mono sub" font-size="10" text-anchor="end" >25%</text><path d="M300.5,182 V204" class="s-gate" stroke-width="2"/><text x="303.5" y="216.0" class="mono sub" font-size="10" text-anchor="start" >30%</text><text x="194.0" y="236.0" class="sub" font-size="11.5" >verify · work · log</text><text x="194.0" y="250.0" class="sub" font-size="11.5" >hand over at 25%</text><rect x="470" y="132" width="170" height="122" rx="10" class="card"/><text x="484.0" y="154.0" class="b" font-size="15" >s02</text><text x="484.0" y="172.0" class="sub" font-size="11.5" >verifies s01 first</text><rect x="484" y="186" width="142" height="14" rx="3" class="gauge"/><rect x="484" y="186" width="88.8" height="14" rx="3" class="gauge-fill"/><path d="M572.8,182 V204" class="s-chain" stroke-width="2"/><text x="569.8" y="216.0" class="mono sub" font-size="10" text-anchor="end" >25%</text><path d="M590.5,182 V204" class="s-gate" stroke-width="2"/><text x="593.5" y="216.0" class="mono sub" font-size="10" text-anchor="start" >30%</text><text x="484.0" y="236.0" class="sub" font-size="11.5" >verify · work · log</text><text x="484.0" y="250.0" class="sub" font-size="11.5" >hand over at 25%</text><rect x="900" y="132" width="170" height="122" rx="10" class="card"/><text x="914.0" y="154.0" class="b" font-size="15" >s03</text><text x="914.0" y="172.0" class="sub" font-size="11.5" >answers R1…Rn first</text><rect x="914" y="186" width="142" height="14" rx="3" class="gauge"/><rect x="914" y="186" width="71.0" height="14" rx="3" class="gauge-fill"/><path d="M1002.8,182 V204" class="s-chain" stroke-width="2"/><text x="999.8" y="216.0" class="mono sub" font-size="10" text-anchor="end" >25%</text><path d="M1020.5,182 V204" class="s-gate" stroke-width="2"/><text x="1023.5" y="216.0" class="mono sub" font-size="10" text-anchor="start" >30%</text><text x="914.0" y="236.0" class="sub" font-size="11.5" >verify · work · log</text><text x="914.0" y="250.0" class="sub" font-size="11.5" >hand over at 25%</text><rect x="1180" y="132" width="170" height="122" rx="10" class="card"/><text x="1194.0" y="154.0" class="b" font-size="15" >s04</text><text x="1194.0" y="172.0" class="sub" font-size="11.5" >and so on</text><rect x="1194" y="186" width="142" height="14" rx="3" class="gauge"/><rect x="1194" y="186" width="35.5" height="14" rx="3" class="gauge-fill"/><path d="M1282.8,182 V204" class="s-chain" stroke-width="2"/><text x="1279.8" y="216.0" class="mono sub" font-size="10" text-anchor="end" >25%</text><path d="M1300.5,182 V204" class="s-gate" stroke-width="2"/><text x="1303.5" y="216.0" class="mono sub" font-size="10" text-anchor="start" >30%</text><text x="1194.0" y="236.0" class="sub" font-size="11.5" >verify · work · log</text><text x="1194.0" y="250.0" class="sub" font-size="11.5" >hand over at 25%</text><g class="e e-flow" id="ch-1" ><path d="M132.0,192.0 L180.0,192.0" marker-end="url(#chain-flow)"/></g><g class="e e-flow" id="ch-2" ><path d="M350.0,192.0 L470.0,192.0" marker-end="url(#chain-flow)"/><text x="410.0" y="172.0" class="el" text-anchor="middle" >handoff +</text></g><text x="410.0" y="214.0" class="mono sub" font-size="11" text-anchor="middle" >chain next</text><path d="M780,150 L830,192 L780,234 L730,192 Z" class="cl cl-chain bg-chain" stroke-width="1.8"/><text x="780.0" y="189.0" class="b t-chain" font-size="12" text-anchor="middle" >Codex</text><text x="780.0" y="204.0" class="sub" font-size="11" text-anchor="middle" >review</text><g class="e e-flow" id="ch-3" ><path d="M640.0,192.0 L730.0,192.0" marker-end="url(#chain-flow)"/><text x="685.0" y="182.0" class="el" text-anchor="middle" >group ends</text></g><g class="e e-flow" id="ch-4" ><path d="M830.0,192.0 L900.0,192.0" marker-end="url(#chain-flow)"/><text x="865.0" y="182.0" class="el" text-anchor="middle" >findings</text></g><g class="e e-flow" id="ch-5" ><path d="M1070.0,192.0 L1180.0,192.0" marker-end="url(#chain-flow)"/><text x="1125.0" y="172.0" class="el" text-anchor="middle" >handoff +</text></g><text x="1125.0" y="214.0" class="mono sub" font-size="11" text-anchor="middle" >chain next</text><text x="780.0" y="252.0" class="sub" font-size="11.5" text-anchor="middle" >group cleared at a commit</text><text x="780.0" y="266.0" class="sub" font-size="11.5" text-anchor="middle" >the owner can merge up to</text><rect x="850" y="306" width="530" height="80" rx="8" class="chip"/><text x="864.0" y="326.0" class="mono b" font-size="12.5" >charter chain next</text><text x="864.0" y="344.0" font-size="12" >refuses a malformed handoff · records what the session committed · re-runs the</text><text x="864.0" y="360.0" font-size="12" >probes of the units it closed · runs the gates on its change set · opens the next</text><text x="864.0" y="376.0" font-size="12" >session</text><text x="150.0" y="316.0" class="sub" font-size="12" >Each session reads its predecessor&#x27;s handoff, verifies that</text><text x="150.0" y="331.0" class="sub" font-size="12" >work first, then works unit after unit. Past 30% of its window</text><text x="150.0" y="346.0" class="sub" font-size="12" >the hook refuses every tool but the handoff, git and charter.</text><g class="e e-wait" id="ch-6" ><path d="M520.0,254.0 L520.0,370.0 Q520.0,380.0 510.0,380.0 L144.0,380.0 Q134.0,380.0 134.0,390.0 L134.0,426.0" marker-end="url(#chain-wait)"/><text x="330.0" y="374.0" class="el" text-anchor="middle" >a session needs the owner</text></g><text x="560.0" y="414.0" class="cap t-owner" font-size="11" >WHEN THE ROAD NEEDS THE OWNER: SUDO, A SETTING, AN ACCOUNT, A RULING</text><rect x="24" y="426" width="220" height="78" rx="10" class="cl cl-chain bg-chain"/><text x="36.0" y="448.0" class="b t-chain" font-size="14" >Session waits</text><text x="36.0" y="468.0" font-size="12" >status: wait · every act</text><text x="36.0" y="485.0" class="sub" font-size="12" >in owner.md, paste-ready</text><rect x="290" y="426" width="220" height="78" rx="10" class="cl cl-chain bg-chain"/><text x="302.0" y="448.0" class="b t-chain" font-size="14" >Codex reads the acts</text><text x="302.0" y="468.0" font-size="12" >sends back what an agent</text><text x="302.0" y="485.0" class="sub" font-size="12" >could do itself</text><g class="e e-flow" id="ch-w1" ><path d="M244.0,465.0 L290.0,465.0" marker-end="url(#chain-flow)"/></g><rect x="556" y="426" width="250" height="78" rx="10" class="cl cl-owner bg-owner"/><text x="568.0" y="448.0" class="b t-owner" font-size="14" >The owner runs them</text><text x="568.0" y="468.0" class="mono" font-size="12" >! python3 .charter/bin/</text><text x="568.0" y="485.0" class="mono" font-size="12" >charter owner run</text><g class="e e-wait" id="ch-w2" ><path d="M510.0,465.0 L556.0,465.0" marker-end="url(#chain-wait)"/></g><rect x="852" y="426" width="230" height="78" rx="10" class="cl cl-owner bg-owner"/><text x="864.0" y="448.0" class="b t-owner" font-size="14" >The owner resumes</text><text x="864.0" y="468.0" class="mono" font-size="12" >/resume-chain ok</text><text x="864.0" y="485.0" class="sub" font-size="12" >closes the lines whose acts passed</text><g class="e e-wait" id="ch-w3" ><path d="M806.0,465.0 L852.0,465.0" marker-end="url(#chain-wait)"/></g><rect x="1128" y="426" width="250" height="78" rx="10" class="cl cl-unit bg-unit"/><text x="1140.0" y="448.0" class="b t-unit" font-size="14" >The next session</text><text x="1140.0" y="468.0" font-size="12" >checks the owner&#x27;s acts first,</text><text x="1140.0" y="485.0" class="sub" font-size="12" >then goes on</text><g class="e e-wait" id="ch-w4" ><path d="M1082.0,465.0 L1128.0,465.0" marker-end="url(#chain-wait)"/></g><text x="24.0" y="548.0" class="cap t-muted" font-size="11" >A CHAIN IS ALWAYS IN ONE OF THESE STATES</text><rect x="24" y="558" width="218" height="60" rx="8" class="chip"/><text x="34.0" y="577.0" class="mono b" font-size="12.5" >running</text><text x="34.0" y="594.0" class="sub" font-size="11.5" >a session works; the next opens at</text><text x="34.0" y="608.0" class="sub" font-size="11.5" >its hand-over</text><rect x="252" y="558" width="218" height="60" rx="8" class="chip"/><text x="262.0" y="577.0" class="mono b" font-size="12.5" >waiting</text><text x="262.0" y="594.0" class="sub" font-size="11.5" >a session needs the owner; every</text><text x="262.0" y="608.0" class="sub" font-size="11.5" >act is in owner.md</text><rect x="480" y="558" width="218" height="60" rx="8" class="chip"/><text x="490.0" y="577.0" class="mono b" font-size="12.5" >halted</text><text x="490.0" y="594.0" class="sub" font-size="11.5" >a session asked a question, or a</text><text x="490.0" y="608.0" class="sub" font-size="11.5" >review could not run</text><rect x="708" y="558" width="218" height="60" rx="8" class="chip"/><text x="718.0" y="577.0" class="mono b" font-size="12.5" >stalled</text><text x="718.0" y="594.0" class="sub" font-size="11.5" >two sessions in a row landed</text><text x="718.0" y="608.0" class="sub" font-size="11.5" >nothing</text><rect x="936" y="558" width="218" height="60" rx="8" class="chip"/><text x="946.0" y="577.0" class="mono b" font-size="12.5" >stopped</text><text x="946.0" y="594.0" class="sub" font-size="11.5" >the owner ran charter chain stop</text><rect x="1164" y="558" width="218" height="60" rx="8" class="bg-pass cl cl-pass"/><text x="1174.0" y="577.0" class="mono b" font-size="12.5" >complete</text><text x="1174.0" y="594.0" class="sub" font-size="11.5" >the road is finished, on a clean</text><text x="1174.0" y="608.0" class="sub" font-size="11.5" >tree</text></svg>
