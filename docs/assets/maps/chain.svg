<svg xmlns="http://www.w3.org/2000/svg" class="cm map-chain" viewBox="0 0 1400 630" role="img" aria-labelledby="chain-title chain-desc" data-view="chain"><title id="chain-title">A chain of sessions (charter 0.4.19)</title><desc id="chain-desc">A continuous chain: sessions s01, s02 and on, each with a context gauge that hands over at 25% and is capped at 30%; a Codex review at the end of each group; and the owner&#x27;s side of a wait: owner.md, charter owner run, /resume-chain ok.</desc><style>svg.cm{--paper:#ffffff;--page:#e9e6de;--fg:#1c1c1e;--muted:#5d6166;--line:#3c3c40;--faint:#dcd9cf;--panel2:#f2f0ea;--block:#4338ca;--block-bg:#e3e7ff;--warn:#a85d00;--warn-bg:#fdf0cf;--pass:#157a3c;--pass-bg:#ddf6e5;--owner:#0d7068;--owner-bg:#d6f5f0;--art:#244b77;--art-bg:#edf2f8;--rec:#5b4a9e;--rec-bg:#eeeaf8;--limit:#d42a2a;--serif:"Charter","Bitstream Charter","Charis SIL",Georgia,serif;--sans:"Liberation Sans Narrow","Arial Narrow","Roboto Condensed","Helvetica Neue",Arial,sans-serif;--mono:"Liberation Mono","DejaVu Sans Mono",Menlo,Consolas,monospace;}@media (prefers-color-scheme:dark){svg.cm{--paper:#17191d;--page:#0f1013;--fg:#e8e6e1;--muted:#a0a4ab;--line:#8a8d93;--faint:#34373d;--panel2:#23262c;--block:#9aa1ff;--block-bg:#232650;--warn:#f0a640;--warn-bg:#3a2b10;--pass:#57d488;--pass-bg:#12301f;--owner:#43c9ba;--owner-bg:#0f2f2c;--art:#94b8e4;--art-bg:#1a2432;--rec:#b7a8ee;--rec-bg:#241f37;}}svg.cm .page{fill:var(--page)}
.cm{font-family:var(--sans)}
.cm text{fill:var(--fg)}
.cm .t-muted,.cm .sub{fill:var(--muted)}
.cm .mono{font-family:var(--mono)}
.cm .serif{font-family:var(--serif);font-weight:700}
