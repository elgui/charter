</style><rect class="page" x="0" y="0" width="1400" height="700" fill="var(--paper)"/><defs><marker id="journey-rule" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk mk-rule"/></marker><marker id="journey-cite" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk mk-cite"/></marker><marker id="journey-propose" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk mk-propose"/></marker><marker id="journey-gate" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk mk-gate"/></marker><marker id="journey-machine" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk mk-machine"/></marker><marker id="journey-flow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk mk-flow"/></marker><marker id="journey-wait" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk mk-wait"/></marker></defs><text x="24.0" y="38.0" class="serif" font-size="24" >From a road to evidence</text><text x="24.0" y="64.0" class="sub" font-size="13" >Read left to right across each row. Charter records, external execution and proposed integration have different guarantees.</text><g id="j.road"><title>Read the road. RELEASED · records. Order and association explain direction; they do not prove dependency readiness. Source: package/.charter/rails.py:116, package/.charter/bin/charter:675</title><rect x="24" y="96" width="320" height="248" rx="10" class="cl cl-art bg-art"/><rect x="24" y="96" width="6" height="248" rx="3" class="f-art"/><text x="40.0" y="121.0" class="serif t-art" font-size="19" >01  Read the road</text><text x="40.0" y="145.0" class="cap t-muted" font-size="10" >RELEASED · records</text><text x="40.0" y="174.0" class="b" font-size="13" >Rails → units → current sources</text><text x="40.0" y="218.0" class="mono" font-size="12" >next --json · unit show --json</text><text x="40.0" y="266.0" class="sub" font-size="12" >Order and association explain direction; they</text><text x="40.0" y="282.0" class="sub" font-size="12" >do not prove dependency readiness.</text></g><g class="e e-flow" id="j-edge-0" ><path d="M344.0,220.0 L368.0,220.0" marker-end="url(#journey-flow)"/></g><g id="j.spec"><title>Resolve the gaps. METHOD · draft recipe. Agents investigate technical unknowns; spec recipe is unreleased and optional. Sensitive rulings remain the owner&#x27;s. Source: docs/method.md, docs/review/2026-11-03-spec-design-verification.md</title><rect x="368" y="96" width="320" height="248" rx="10" class="cl cl-art bg-art"/><rect x="368" y="96" width="6" height="248" rx="3" class="f-art"/><text x="384.0" y="121.0" class="serif t-art" font-size="19" >02  Resolve the gaps</text><text x="384.0" y="145.0" class="cap t-muted" font-size="10" >METHOD · draft recipe</text><text x="384.0" y="174.0" class="b" font-size="13" >Compare sources, code and promises</text><text x="384.0" y="218.0" class="mono" font-size="12" >Specs · decisions · open questions</text><text x="384.0" y="266.0" class="sub" font-size="12" >Agents investigate technical unknowns; spec</text><text x="384.0" y="282.0" class="sub" font-size="12" >recipe is unreleased and optional. Sensitive</text><text x="384.0" y="298.0" class="sub" font-size="12" >rulings remain the owner&#x27;s.</text></g><g class="e e-flow" id="j-edge-1" ><path d="M688.0,220.0 L712.0,220.0" marker-end="url(#journey-flow)"/></g><g id="j.units"><title>Make work checkable. RELEASED · unit contract. Review spec and units together. Judge probe relevance; passing form alone proves no behavior. Source: package/.charter/checks.py:765, docs/verification.md</title><rect x="712" y="96" width="320" height="248" rx="10" class="cl cl-unit bg-unit"/><rect x="712" y="96" width="6" height="248" rx="3" class="f-unit"/><text x="728.0" y="121.0" class="serif t-unit" font-size="19" >03  Make work checkable</text><text x="728.0" y="145.0" class="cap t-muted" font-size="10" >RELEASED · unit contract</text><text x="728.0" y="174.0" class="b" font-size="13" >Perimeter · acceptance · dependencies</text><text x="728.0" y="218.0" class="mono" font-size="12" >probe UNIT --json · baseline checks</text><text x="728.0" y="266.0" class="sub" font-size="12" >Review spec and units together. Judge probe</text><text x="728.0" y="282.0" class="sub" font-size="12" >relevance; passing form alone proves no</text><text x="728.0" y="298.0" class="sub" font-size="12" >behavior.</text></g><g class="e e-flow" id="j-edge-2" ><path d="M1032.0,220.0 L1056.0,220.0" marker-end="url(#journey-flow)"/></g><g id="j.plan"><title>Inspect the selection. INTEGRATION · proposed. Validate dependency closure and current authority. Existing Road interpretation is not runtime admission. Source: docs/design/project-road-control-center.md</title><rect x="1056" y="96" width="320" height="248" rx="10" class="cl cl-gate bg-gate"/><rect x="1056" y="96" width="6" height="248" rx="3" class="f-gate"/><text x="1072.0" y="121.0" class="serif t-gate" font-size="19" >04  Inspect the selection</text><text x="1072.0" y="145.0" class="cap t-muted" font-size="10" >INTEGRATION · proposed</text><text x="1072.0" y="174.0" class="b" font-size="13" >Exact revision, units and prerequisites</text><text x="1072.0" y="218.0" class="mono" font-size="12" >Plan identity · runner · supervisor</text><text x="1072.0" y="266.0" class="sub" font-size="12" >Validate dependency closure and current</text><text x="1072.0" y="282.0" class="sub" font-size="12" >authority. Existing Road interpretation is not</text><text x="1072.0" y="298.0" class="sub" font-size="12" >runtime admission.</text></g><g id="j.launch"><title>Launch once. RUNNER · adapter needed. Current group runner takes one group; chain ignores human gates. Multi-rail admission is new integration work. Source: package/.charter/chain.py:1903, docs/design/project-road-control-center.md</title><rect x="24" y="374" width="320" height="248" rx="10" class="cl cl-chain bg-chain"/><rect x="24" y="374" width="6" height="248" rx="3" class="f-chain"/><text x="40.0" y="399.0" class="serif t-chain" font-size="19" >05  Launch once</text><text x="40.0" y="423.0" class="cap t-muted" font-size="10" >RUNNER · adapter needed</text><text x="40.0" y="452.0" class="b" font-size="13" >Claim the inspected plan atomically</text><text x="40.0" y="496.0" class="mono" font-size="12" >Supervised group OR compatible chain</text><text x="40.0" y="544.0" class="sub" font-size="12" >Current group runner takes one group; chain</text><text x="40.0" y="560.0" class="sub" font-size="12" >ignores human gates. Multi-rail admission is</text><text x="40.0" y="576.0" class="sub" font-size="12" >new integration work.</text></g><g class="e e-flow" id="j-edge-4" ><path d="M344.0,498.0 L368.0,498.0" marker-end="url(#journey-flow)"/></g><g id="j.evidence"><title>Observe evidence. RELEASED + external runner. Keep deterministic checking, provider review, human credit and observed delivery distinct. Source: docs/verification.md, package/.charter/chain_groups.py:86</title><rect x="368" y="374" width="320" height="248" rx="10" class="cl cl-rec bg-rec"/><rect x="368" y="374" width="6" height="248" rx="3" class="f-rec"/><text x="384.0" y="399.0" class="serif t-rec" font-size="19" >06  Observe evidence</text><text x="384.0" y="423.0" class="cap t-muted" font-size="10" >RELEASED + external runner</text><text x="384.0" y="452.0" class="b" font-size="13" >Commits · probes · independent review</text><text x="384.0" y="496.0" class="mono" font-size="12" >Judged revision · findings · answers</text><text x="384.0" y="544.0" class="sub" font-size="12" >Keep deterministic checking, provider review,</text><text x="384.0" y="560.0" class="sub" font-size="12" >human credit and observed delivery distinct.</text></g><g class="e e-flow" id="j-edge-5" ><path d="M688.0,498.0 L712.0,498.0" marker-end="url(#journey-flow)"/></g><g id="j.recover"><title>Pause and recover. RUNNER · specific semantics. Preserve work and reconcile before retry. A chain resume remains an owner act; no timeout supplies approval. Source: package/.charter/chain.py:1535, docs/design/project-road-control-center.md</title><rect x="712" y="374" width="320" height="248" rx="10" class="cl cl-chain bg-chain"/><rect x="712" y="374" width="6" height="248" rx="3" class="f-chain"/><text x="728.0" y="399.0" class="serif t-chain" font-size="19" >07  Pause and recover</text><text x="728.0" y="423.0" class="cap t-muted" font-size="10" >RUNNER · specific semantics</text><text x="728.0" y="452.0" class="b" font-size="13" >Durable run state and exact next step</text><text x="728.0" y="496.0" class="mono" font-size="12" >Failed · unknown · interrupted · held</text><text x="728.0" y="544.0" class="sub" font-size="12" >Preserve work and reconcile before retry. A</text><text x="728.0" y="560.0" class="sub" font-size="12" >chain resume remains an owner act; no timeout</text><text x="728.0" y="576.0" class="sub" font-size="12" >supplies approval.</text></g><g class="e e-flow" id="j-edge-6" ><path d="M1032.0,498.0 L1056.0,498.0" marker-end="url(#journey-flow)"/></g><g id="j.owner"><title>Show what remains. RELEASED · owner boundary. Agent checks and review precede handoff. Execution, acceptance, merge and deployment remain distinct. Source: package/.charter/owner.py:163, docs/design/owner-acceptance.md</title><rect x="1056" y="374" width="320" height="248" rx="10" class="cl cl-owner bg-owner"/><rect x="1056" y="374" width="6" height="248" rx="3" class="f-owner"/><text x="1072.0" y="399.0" class="serif t-owner" font-size="19" >08  Show what remains</text><text x="1072.0" y="423.0" class="cap t-muted" font-size="10" >RELEASED · owner boundary</text><text x="1072.0" y="452.0" class="b" font-size="13" >Only the remaining judgment or authority</text><text x="1072.0" y="496.0" class="mono" font-size="12" >owner --json · bound confirmation</text><text x="1072.0" y="544.0" class="sub" font-size="12" >Agent checks and review precede handoff.</text><text x="1072.0" y="560.0" class="sub" font-size="12" >Execution, acceptance, merge and deployment</text><text x="1072.0" y="576.0" class="sub" font-size="12" >remain distinct.</text></g><text x="24.0" y="363.0" class="sub" font-size="12" >04 → 05: admission binds what was inspected to what will execute; a preview never launches work.</text><text x="24.0" y="650.0" class="b" font-size="13" >Agent work: investigate, implement, check, review and correct. Owner work: remaining sensitive judgment and reserved authority.</text><text x="24.0" y="674.0" class="sub" font-size="12" >Availability and sources: maps.md §9 · method.md · verification.md · design/project-road-control-center.md</text></svg>
