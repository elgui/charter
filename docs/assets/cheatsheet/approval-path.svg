<svg class="diagram" data-export="approval-path" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 111" role="img" aria-label="Source criterion, Charter export, desk card, explicit owner confirmation, Charter commit. Source and export issues belong to Charter; discovery and confirmation issues belong to Tele-Claude; writeback requires their contract." width="1040" height="111"><defs><marker id="a-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#527468"></path></marker><style>text{font-family:Arial,sans-serif}</style></defs><g stroke="#b1c6b9" fill="#eef5f1"><rect x="1" y="5" width="183" height="59" rx="7"></rect><rect x="215" y="5" width="183" height="59" rx="7"></rect><rect x="856" y="5" width="183" height="59" rx="7"></rect></g><rect x="429" y="5" width="183" height="59" rx="7" fill="#f0f4f8" stroke="#b6c8d5"></rect><rect x="644" y="5" width="180" height="59" rx="7" fill="#fff6e8" stroke="#cbab77"></rect><g font-size="17" text-anchor="middle" fill="#153c38"><text x="92" y="29">Source criterion</text><text x="92" y="51" font-size="14">unit + file + branch</text><text x="306" y="29">Charter export</text><text x="306" y="51" font-size="14">owner --json</text><text x="520" y="29">Desk card</text><text x="520" y="51" font-size="14">context + expected result</text><text x="734" y="29">You confirm</text><text x="734" y="51" font-size="14">the criterion is satisfied</text><text x="947" y="29">Charter commit</text><text x="947" y="51" font-size="14">one tick + dated receipt</text></g><g stroke="#527468" stroke-width="2" marker-end="url(#a-arrow)"><path d="M187 34H209"></path><path d="M401 34H423"></path><path d="M615 34H638"></path><path d="M827 34H850"></path></g><text x="1" y="88" font-size="14" fill="#526561">Charter: wrong source, gate or export</text><text x="429" y="88" font-size="14" fill="#526561">Tele-Claude: discovery, wording, confirmation or delivery</text><text x="1" y="108" font-size="13" fill="#8b4f12">Changed criterion / branch, dirty tasket or failed commit → request stays open. Confirmation does not run the described act or its probe.</text></svg>
