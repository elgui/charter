<svg class="diagram" data-export="responsibilities" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 140" role="img" aria-label="Charter owns the work record and its gates. Tele-Claude hosts sessions and automation. Its Owner Desk presents owner actions and sends confirmations to Charter." width="1040" height="140">
<defs><marker id="r-arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7" fill="#527468"></path></marker><style>text{font-family:Arial,sans-serif}</style></defs>
<rect x="1" y="1" width="330" height="105" rx="9" fill="#eef5f1" stroke="#a9c4b4"></rect><text x="18" y="29" font-size="21" font-weight="700" fill="#153c38">CHARTER · the work record</text><text x="18" y="54" font-size="15" fill="#153c38">Taskets · criteria · probes · decisions · road</text><text x="18" y="77" font-size="15" fill="#153c38">Gates · protected fields · owner commits</text><text x="18" y="97" font-size="13" fill="#526561">Source of truth: the project repository</text>
<rect x="361" y="1" width="678" height="105" rx="9" fill="#f0f4f8" stroke="#b6c8d5"></rect><text x="379" y="29" font-size="21" font-weight="700" fill="#24475c">TELE-CLAUDE · the workspace</text><text x="379" y="54" font-size="15" fill="#24475c">Cards · sessions · tasket board</text><text x="379" y="77" font-size="15" fill="#24475c">Automation, supervision and checker</text><text x="379" y="97" font-size="13" fill="#526561">Hosts the work and shows its state.</text>
<rect x="700" y="11" width="326" height="84" rx="7" fill="#fff6e8" stroke="#cbab77"></rect><text x="716" y="36" font-size="20" font-weight="700" fill="#8b4f12">OWNER DESK · what needs you</text><text x="716" y="59" font-size="15" fill="#704511">Decide · do · check</text><text x="716" y="81" font-size="14" fill="#704511">One explicit approval, with a receipt.</text>
<path d="M331 48H355" stroke="#527468" stroke-width="2" marker-end="url(#r-arrow)"></path><path d="M854 107V124H166V109" fill="none" stroke="#527468" stroke-width="1.5" marker-end="url(#r-arrow)"></path><rect x="351" y="113" width="340" height="24" fill="white"></rect><text x="521" y="130" text-anchor="middle" font-size="14" fill="#526561">Owner confirmation → Charter acceptance commit</text></svg>
