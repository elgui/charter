<svg class="diagram" data-export="maintenance-layers" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 116" role="img" aria-label="The available Charter package, the installed project copy, the user machine layer, and deployed Tele-Claude are separate layers with separate update paths." width="1040" height="116"><style>text{font-family:Arial,sans-serif}</style><g fill="#f6f8f5" stroke="#bdcec3"><rect x="1" y="1" width="249" height="112" rx="7"></rect><rect x="264" y="1" width="249" height="112" rx="7"></rect><rect x="527" y="1" width="249" height="112" rx="7"></rect><rect x="790" y="1" width="249" height="112" rx="7"></rect></g><g fill="#153c38"><text x="15" y="26" font-size="18" font-weight="700">1 · Package checkout</text><text x="15" y="50" font-size="14">Version available to install.</text><text x="15" y="71" font-size="14">Changing it updates no project.</text><text x="15" y="97" font-size="13" fill="#526561">Inspect: charter-pkg status / fleet</text><text x="278" y="26" font-size="18" font-weight="700">2 · Project installation</text><text x="278" y="50" font-size="14">Its own .charter/ and rules.</text><text x="278" y="71" font-size="14">Upgrade on an isolated branch.</text><text x="278" y="97" font-size="13" fill="#526561">Procedure: docs/install.md</text><text x="541" y="26" font-size="18" font-weight="700">3 · User machine layer</text><text x="541" y="50" font-size="14">Shared Claude skill and hook.</text><text x="541" y="71" font-size="14">Linked files may be live on edit.</text><text x="541" y="97" font-size="13" fill="#526561">Inspect: charter-pkg machine status</text><text x="804" y="26" font-size="18" font-weight="700">4 · Tele-Claude live</text><text x="804" y="50" font-size="14">Backend running + dashboard built.</text><text x="804" y="71" font-size="14">Restart and frontend deploy differ.</text><text x="804" y="97" font-size="13" fill="#526561">Inspect: desk restart / build asks</text></g></svg>
